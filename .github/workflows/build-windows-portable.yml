name: Build Windows Portable + Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'assets/**'
      - 'requirements.txt'
      - 'PrincipaisCapas.spec'
      - 'version.txt'
      - '.github/workflows/build-windows-portable.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar paridade Android 0.7.7.7
        shell: pwsh
        run: python scripts/apply_windows_parity_v1_2_5.py

      - name: Aplicar conectividade Windows v1.2.6
        shell: pwsh
        run: python scripts/apply_windows_connectivity_v1_2_6.py

      - name: Validar fontes Python
        shell: pwsh
        run: python -m compileall -q app main.py

      - name: Registrar fontes Windows
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/models.py app/ocr.py app/ui.py app/web_resolver.py app/network.py app/valor_email_pdf.py requirements.txt version.txt README.md
            git commit -m "fix(windows): conectividade Gmail e Valor v1.2.6 [skip ci]"
            git push origin HEAD:main
          } else {
            Write-Host "Fontes Windows já estão atualizadas."
          }

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install portable OCR engine
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path $src)) { throw "Tesseract não localizado" }
          New-Item -ItemType Directory -Force -Path vendor\tesseract | Out-Null
          Copy-Item "$src\*" vendor\tesseract -Recurse -Force
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/por.traineddata" -OutFile "vendor\tesseract\tessdata\por.traineddata"

      - name: Build portable app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean PrincipaisCapas.spec

      - name: Create portable ZIP
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          $zip = "PrincipaisCapas-Windows-Portable-v$version.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist\PrincipaisCapas-Portable\*" -DestinationPath $zip -CompressionLevel Optimal
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Publish directly to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ steps.package.outputs.version }}
          name: Principais Capas Windows Portable v${{ steps.package.outputs.version }}
          body: |
            Windows Portable do Principais Capas.
            Extraia o ZIP e execute PrincipaisCapas.exe.
          files: ${{ steps.package.outputs.zip }}
          make_latest: true
